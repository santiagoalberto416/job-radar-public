sources:
  # --- JobSpy: lee páginas públicas de búsqueda, sin iniciar sesión.
  # ⚠️ Los términos de uso de LinkedIn e Indeed no permiten acceso automatizado; úsalo bajo tu responsabilidad.
  indeed_mx:
    enabled: true
    min_interval_hours: 2
    country: mexico
    hours_old: 24
    results_wanted: 25
    searches:
      - {term: "Angular", location: "México"}
      - {term: "Frontend Senior", location: "México"}
      - {term: "React Senior", location: "México"}
  indeed_us:
    enabled: true
    min_interval_hours: 2
    country: usa
    hours_old: 24
    results_wanted: 25
    searches:
      - {term: "Senior Frontend Engineer Latin America", remote: true}
      - {term: "Frontend Developer remote LatAm", remote: true}
  linkedin:
    # Solo búsqueda pública (nunca inicia sesión). Más lento para no saturar.
    enabled: true
    min_interval_hours: 4
    hours_old: 24
    results_wanted: 20
    searches:
      - {term: "Senior Angular Developer", location: "Mexico"}
      - {term: "Senior Frontend Engineer React", location: "Mexico"}
      - {term: "Frontend Developer remote LatAm", location: "Latin America"}
      - {term: "Senior Frontend Engineer", location: "Guadalajara, Jalisco, Mexico"}
  google:
    # Desactivado: el lector de Google Jobs de JobSpy devolvía 0 resultados (sept. 2026).
    # Actívalo y corre `check-sources` para probarlo de nuevo.
    enabled: false
    min_interval_hours: 4
    results_wanted: 20
    searches:
      - {term: "senior frontend developer remote mexico since yesterday"}
      - {term: "senior angular developer remote latam since yesterday"}

  # --- APIs públicas de ATS por empresa (verificadas en sept. 2026). Cómo agregar empresas: ver README. ---
  greenhouse:
    enabled: true
    min_interval_hours: 6
    companies:
      - wizeline      # nearshore, México
      - arionkoder    # nearshore, LatAm
      - nearform
      - xtillion
      - thoughtworks
      - turing        # remote contractors
      - clara         # Mexico fintech
      - gitlab
      - remotecom
      - grafanalabs
      - canonical
      - tailscale
      - mattermost
      - vercel
      - launchdarkly
      - contentful
      - webflow
      - oddball
      - wikimedia
  lever:
    enabled: true
    min_interval_hours: 6
    companies:
      - kavak         # Mexico
  ashby:
    enabled: true
    min_interval_hours: 6
    companies:
      - andela        # remote contractors, LatAm
      - belvo         # LatAm fintech
      - posthog
      - supabase
      - linear
      - n8n
      - sanity
      - replit
      - zapier
      - airbyte
      - 1password
      - close
      - helpscout
      - railway
      - resend

  # --- Bolsas de trabajo remoto (APIs públicas) ---
  remotive:
    # Remotive pide máximo ~4 consultas al día.
    enabled: true
    min_interval_hours: 6
    category: software-dev
  remoteok:
    enabled: true
    min_interval_hours: 4
  computrabajo:
    # ⚠️ DESACTIVADO por defecto. Computrabajo no tiene API, su aviso legal prohíbe el acceso automatizado y
    # bloquea bots que se identifican como tales, así que job-radar lo lee con encabezados de navegador.
    # Actívalo solo si aceptas ese riesgo (pueden bloquear tu IP).
    enabled: false
    min_interval_hours: 6
    delay_seconds: 5          # pause between requests
    max_details_per_run: 15   # job pages fetched per run (only new jobs that passed the prefilter)
    searches:
      - {term: angular}
      - {term: react}
      - {term: frontend}
      - {term: desarrollador front end, location: jalisco}
  himalayas:
    # Ofertas remotas abiertas a tu país (filtro `country`, código ISO: MX, CO, AR...). Actualiza sus datos una
    # vez al día. Sus términos piden enlazar a Himalayas y nombrarlo como fuente (el resumen de Telegram lo hace).
    enabled: true
    min_interval_hours: 24
    country: MX
    pages: 2        # 20 jobs per page, newest first
    queries:
      - frontend
      - angular
      - react
  jobicy:
    # Ofertas remotas por región (geos). Sus términos: dar crédito a Jobicy, usar su enlace y consultar máximo 1 vez/hora.
    enabled: true
    min_interval_hours: 6
    count: 50
    industry: engineering
    geos:
      - mexico
      - latam
  getonboard:
    enabled: true
    min_interval_hours: 4
    per_page: 50
    queries:
      - angular
      - react
      - frontend
